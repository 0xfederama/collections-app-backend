# Builds the API image on every version tag and pushes it to GHCR (D-117).
# A tag is not a deploy: the user approves prod by publishing a GitHub Release (latest).
name: release-image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Native arm64 runner (free for public repos): the arm64 image builds without emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR names must be lower case; the package inherits the private repo's visibility.
          images: ghcr.io/${{ github.repository_owner }}/collections-app-backend
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 only: prod (Raspberry Pi) and the dev Mac are arm64. Native runner; the Dockerfile still cross-compiles for any other host.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
