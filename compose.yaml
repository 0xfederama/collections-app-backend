# Local entry point: `docker compose up --build` (db + migrate + api).
services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: collection
      POSTGRES_DB: collection
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collection -d collection"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The API image applies its own embedded migrations and exits; the server never migrates.
  migrate:
    build: .
    image: collections-app-backend:local
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://db:5432/collection?user=collection&password=${POSTGRES_PASSWORD}&sslmode=disable

  api:
    build: .
    image: collections-app-backend:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://db:5432/collection?user=collection&password=${POSTGRES_PASSWORD}&sslmode=disable
      DATA_DIR: /data
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Collections}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_MOCK_FIXTURE: ${TMDB_MOCK_FIXTURE:-false}
      OPENLIBRARY_CONTACT: ${OPENLIBRARY_CONTACT:-}
      HARDCOVER_API_KEY: ${HARDCOVER_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
