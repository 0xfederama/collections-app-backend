# Local entry point: `docker compose up --build` (db + migrate + api).
services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: collection
      POSTGRES_DB: collection
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collection -d collection"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://db:5432/collection?user=collection&password=${POSTGRES_PASSWORD}&sslmode=disable
    volumes:
      - ./db/migrations:/migrations:ro
    # `migrate up` exits 1 on a directory without migrations (D-037), so skip until one exists.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ls /migrations/*.up.sql >/dev/null 2>&1; then
          exec migrate -path /migrations -database "$$DATABASE_URL" up
        fi
        echo "no migrations yet, nothing to apply"

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://db:5432/collection?user=collection&password=${POSTGRES_PASSWORD}&sslmode=disable
      DATA_DIR: /data
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Our Collection}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_MOCK_FIXTURE: ${TMDB_MOCK_FIXTURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
